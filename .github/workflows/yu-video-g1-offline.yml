name: YOUTOPIA video understanding G1-G2F offline
on:
  push:
    branches:
      - experiment/yu-video-understanding-poc-v01
    paths:
      - shared/experiments/yu-video-understanding-poc-v0/**
      - docs/research/YU_VIDEO_UNDERSTANDING_POC_G1_QA_V01.md
      - docs/research/YU_VIDEO_UNDERSTANDING_POC_G2_SOURCE_PROVIDER_REVIEW_V01.md
      - docs/research/YU_VIDEO_UNDERSTANDING_POC_G2B_CANDIDATE_REVIEW_V01.md
      - docs/research/YU_VIDEO_UNDERSTANDING_POC_G2C_BLENDER_SOURCE_EVIDENCE_V01.md
      - docs/research/YU_VIDEO_G2D_HUMAN_SYNC_YOUTUBE_REVIEW_V01.md
      - docs/research/YU_VIDEO_G2E_GOLD_CANDIDATE_DESIGN_V01.md
      - docs/research/YU_VIDEO_G2F_INDEPENDENT_GOLD_REVIEW_V01.md
      - .github/workflows/yu-video-g1-offline.yml
  pull_request:
    paths:
      - shared/experiments/yu-video-understanding-poc-v0/**
      - .github/workflows/yu-video-g1-offline.yml
permissions:
  contents: read
jobs:
  offline-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and synthetic/eligibility tests
        run: |
          node --check shared/experiments/yu-video-understanding-poc-v0/g1-offline.cjs
          node --check shared/experiments/yu-video-understanding-poc-v0/g2-source-provider.cjs
          node --check shared/experiments/yu-video-understanding-poc-v0/g2b-research-audit.cjs
          node --check shared/experiments/yu-video-understanding-poc-v0/g2c-offline-verifier.cjs
          node --check shared/experiments/yu-video-understanding-poc-v0/g2d-human-review.cjs
          node --check shared/experiments/yu-video-understanding-poc-v0/g2d-workspace-media.cjs
          node --check shared/experiments/yu-video-understanding-poc-v0/g2d-workspace-server.cjs
          node --check shared/experiments/yu-video-understanding-poc-v0/g2d-workspace-client.js
          node --check shared/experiments/yu-video-understanding-poc-v0/g2d-playback-sync.js
          node --check shared/experiments/yu-video-understanding-poc-v0/g2e-gold-pilot.cjs
          node --check shared/experiments/yu-video-understanding-poc-v0/g2f-blind-review.cjs
          node --check shared/experiments/yu-video-understanding-poc-v0/g2f-reviewer-workspace-server.cjs
          node --check shared/experiments/yu-video-understanding-poc-v0/g2f-reviewer-workspace-client.js
          node --test shared/experiments/yu-video-understanding-poc-v0/tests/*.test.cjs
      - name: Fail-closed gate
        run: |
          node shared/experiments/yu-video-understanding-poc-v0/g1-offline.cjs | node -e '
            let s="";process.stdin.on("data",v=>s+=v);
            process.stdin.on("end",()=>{const x=JSON.parse(s);
              if(x.status!=="OFFLINE_ONLY"||x.liveCallsAuthorized!==false||x.externalCalls!==0||
                 x.actualSpendUsd!==0||x.mergeApproved!==false||
                 x.quality.liveAccuracyVerified!==false||x.quality.decision!=="INCONCLUSIVE_OFFLINE_SYNTHETIC")
                process.exit(1);
              process.stdout.write("G1_OFFLINE_GATE_PASS\n");
            });'

      - name: G2 provider and rights default-deny gate
        run: |
          node shared/experiments/yu-video-understanding-poc-v0/g2-source-provider.cjs | node -e '
            let s="";process.stdin.on("data",v=>s+=v);
            process.stdin.on("end",()=>{const x=JSON.parse(s);
              if(x.status!=="SOURCE_PROVIDER_DOCUMENT_REVIEW_ONLY"||
                 x.externalCalls!==0||x.actualSpendUsd!==0||x.liveCallsAuthorized!==false||
                 x.mergeApproved!==false||x.source.approvedForG3!==false||
                 x.source.sourceRightsVerifiedCount!==0||x.illustrativeTokenComponent.estimatedEndToEndTotalUsd!==null)
                process.exit(1);
              process.stdout.write("G2_DEFAULT_DENY_GATE_PASS\n");
            });'

      - name: G2-B researched candidates remain unapproved
        run: |
          node shared/experiments/yu-video-understanding-poc-v0/g2b-research-audit.cjs | node -e '
            let s="";process.stdin.on("data",v=>s+=v);
            process.stdin.on("end",()=>{const x=JSON.parse(s);
              if(x.status!=="SIX_PUBLIC_RESEARCH_CANDIDATES_NOT_APPROVED_DATASET"||
                 x.documentedCandidates!==6||x.sourceRightsVerified!==0||
                 x.youtubeToSourceVersionMatchesVerified!==0||
                 x.captionTimelineAlignmentsVerified!==0||
                 x.humanReviewedGoldQuestionCount!==0||
                 x.approvedRealDatasetCount!==0||
                 x.liveCallsAuthorized!==false||x.actualProviderCalls!==0||
                 x.actualSpendUsd!==0||x.mergeAuthorized!==false)
                 process.exit(1);
              process.stdout.write("G2B_DEFAULT_DENY_GATE_PASS\n");
            });'

      - name: G2-C publisher provenance without claiming local media verification
        run: |
          node shared/experiments/yu-video-understanding-poc-v0/g2c-offline-verifier.cjs | node -e '
            let s="";process.stdin.on("data",v=>s+=v);
            process.stdin.on("end",()=>{const x=JSON.parse(s);
              if(x.status!=="PUBLISHER_RIGHTS_AND_SUBTITLE_LISTINGS_DOCUMENTED_MEDIA_UNVERIFIED"||
                 x.documentaryEvidenceCount!==2||x.records.length!==2||
                 x.records.some(r=>!r.officialSrtListingConfirmed||r.readyForG3)||
                 x.filmRightsForServiceApproved!==0||x.sourceFileHashesVerified!==0||
                 x.youtubeVersionEquivalencesVerified!==0||x.captionSyntaxRealFilesVerified!==0||
                 x.spokenCaptionAlignmentsVerified!==0||x.humanGoldReviewed!==0||
                 x.externalCalls!==0||x.actualSpendUsd!==0||
                 x.liveCallsAuthorized!==false||x.g3Authorized!==false||x.merged!==false)
                process.exit(1);
              process.stdout.write("G2C_PUBLISHER_METADATA_PASS_MEDIA_STILL_UNVERIFIED\n");
            });'

      - name: G2-E offline real-film question candidates must remain unlabelled and unapproved
        run: |
          node shared/experiments/yu-video-understanding-poc-v0/g2e-gold-pilot.cjs | node -e '
            let s="";process.stdin.on("data",v=>s+=v);
            process.stdin.on("end",()=>{const x=JSON.parse(s);
              if(x.status!=="PUBLIC_QUESTION_DRAFTS_ONLY_NO_GOLD_ANSWERS"||
                 x.pilotQuestionDrafts!==12||x.g0TargetQuestions!==36||x.filmCount!==2||
                 x.goldAnswersVerified!==0||
                 x.externalProviderCalls!==0||x.actualSpendUsd!==0||
                 x.g3Authorized!==false) process.exit(1);
              process.stdout.write("G2E_QUESTION_CANDIDATES_UNVERIFIED_GATE_PASS\n");
            });'

      - name: G2-F offline blind-review protocol never approves actual gold or G3
        run: |
          node shared/experiments/yu-video-understanding-poc-v0/g2f-blind-review.cjs | node -e '
            let s="";process.stdin.on("data",v=>s+=v);
            process.stdin.on("end",()=>{const x=JSON.parse(s);
              if(x.stage!=="G2-F"||
                 x.status!=="OFFLINE_TWO_BLIND_REVIEWER_PROTOCOL_READY_NO_REVIEWS"||
                 x.externalProviderCalls!==0||x.verifiedIndependentHumanReviewers!==0||
                 x.independentGoldApproved!==0||x.g3Authorized!==false)process.exit(1);
              process.stdout.write("G2F_BLIND_QUESTION_PACK_NO_APPROVAL_PASS\n");
            });'

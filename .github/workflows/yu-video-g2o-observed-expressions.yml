name: YOUTOPIA G2-O observed expression candidates

on:
  push:
    branches:
      - feature/yu-video-g2o-observed-expression-candidates-v01
    paths:
      - 'frontend/**'
      - '.github/workflows/yu-video-g2o-observed-expressions.yml'
  pull_request:
    branches:
      - feature/yu-video-g2n-user-expression-expansion-v01
    paths:
      - 'frontend/**'
      - '.github/workflows/yu-video-g2o-observed-expressions.yml'

permissions:
  contents: read

jobs:
  local-observed-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '12.9.1'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Offline proxy tests (fake upstream; no API key)
        run: node --test shared/experiments/yu-video-understanding-poc-v0/tests/g2l-youtube-search-proxy.test.cjs shared/experiments/yu-video-understanding-poc-v0/tests/g2m-comment-sample.test.cjs
      - name: Frozen frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Frontend Vitest
        run: pnpm --dir frontend test
      - name: TypeScript and Vite build
        run: pnpm --dir frontend build

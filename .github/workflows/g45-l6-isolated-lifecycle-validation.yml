name: G45 L6 isolated PostgreSQL Redis lifecycle tests

on:
  pull_request:
    branches:
      - feat/backend-bootstrap
  push:
    branches:
      - feat/backend-bootstrap

permissions:
  contents: read

jobs:
  g45-l6-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start owned disposable loopback PostgreSQL and Redis
        run: |
          set -euo pipefail
          python3 tools/test_services.py start --quiet
      - name: Test only synthetic PostgreSQL TEMP tables and UUID Redis cache keys
        run: |
          set -euo pipefail
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew
          ./gradlew --no-daemon integrationTest --tests 'com.youtopia.youtube.lifecycle.G45L6IsolatedLifecycleIntegrationTest'
      - name: Stop only owned disposable containers
        if: always()
        run: python3 tools/test_services.py stop

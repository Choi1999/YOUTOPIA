name: Review NLP synthetic offline validation
on:
  push:
    branches: [feat/backend-bootstrap]
    paths: [ml/reviews/**, .github/workflows/review-nlp-offline.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/reviews/requirements.txt
      - name: Install isolated CPU dependencies (no pretrained model download)
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ml/reviews/requirements.txt
      - name: Contract, four trainers, final-test freeze, and batch states
        run: python -m unittest discover -s ml/reviews/tests -v

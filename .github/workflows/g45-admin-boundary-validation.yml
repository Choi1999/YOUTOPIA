name: G45 backend admin deletion boundary (no DB or external API)

on:
  pull_request:
    branches:
      - feat/backend-bootstrap
  push:
    branches:
      - feat/backend-bootstrap

permissions:
  contents: read

jobs:
  g45-admin-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run G45 synthetic admin security and lifecycle contract tests (NO live data)
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew
          ./gradlew --no-daemon test --tests 'com.youtopia.youtube.admin.G45AdminDeletionBoundarySecurityTest' --tests 'com.youtopia.youtube.lifecycle.G45LifecycleBoundaryContractTest'

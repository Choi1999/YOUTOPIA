name: YOUTOPIA G2C-G2F Windows offline scripts
on:
  push:
    branches:
      - experiment/yu-video-understanding-poc-v01
    paths:
      - shared/experiments/yu-video-understanding-poc-v0/g2c-windows-official-media.ps1
      - shared/experiments/yu-video-understanding-poc-v0/g2d-windows-manual-review.ps1
      - shared/experiments/yu-video-understanding-poc-v0/g2e-windows-gold-pilot.ps1
      - shared/experiments/yu-video-understanding-poc-v0/g2f-windows-independent-review.ps1
      - shared/experiments/yu-video-understanding-poc-v0/g2f-open-reviewer-workspace.ps1
      - shared/experiments/yu-video-understanding-poc-v0/g2d-open-workspace.ps1
      - shared/experiments/yu-video-understanding-poc-v0/g2d-human-review.cjs
      - .github/workflows/yu-video-g2c-windows-plan.yml
  pull_request:
    paths:
      - shared/experiments/yu-video-understanding-poc-v0/g2c-windows-official-media.ps1
      - shared/experiments/yu-video-understanding-poc-v0/g2d-windows-manual-review.ps1
      - shared/experiments/yu-video-understanding-poc-v0/g2e-windows-gold-pilot.ps1
      - shared/experiments/yu-video-understanding-poc-v0/g2f-windows-independent-review.ps1
      - shared/experiments/yu-video-understanding-poc-v0/g2f-open-reviewer-workspace.ps1
      - shared/experiments/yu-video-understanding-poc-v0/g2d-open-workspace.ps1
      - shared/experiments/yu-video-understanding-poc-v0/g2d-human-review.cjs
      - .github/workflows/yu-video-g2c-windows-plan.yml
permissions:
  contents: read
jobs:
  windows-plan:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify zero-network Plan mode for both official Blender titles
        shell: pwsh
        run: |
          $script = ".\shared\experiments\yu-video-understanding-poc-v0\g2c-windows-official-media.ps1"
          foreach ($film in @('Sintel','TearsOfSteel')) {
            $p = (& $script -Mode Plan -Film $film | Out-String | ConvertFrom-Json)
            if ($p.stage -ne 'G2-C' -or $p.mode -ne 'PLAN_ONLY' -or $p.film -ne $film -or
                $p.actualDownloads -ne 0 -or $p.downloadsAuthorizedByPlan -ne $false -or
                $p.rawMediaVerified -ne $false -or $p.youtubeCompared -ne $false -or
                $p.g3Authorized -ne $false -or $p.actualProviderCalls -ne 0 -or
                $p.actualSpendUsd -ne 0 -or
                -not $p.mediaUrl.StartsWith('https://download.blender.org/') -or
                $p.publisherIndexBytes -lt 300000000) {
              throw 'G2C_WINDOWS_PLAN_GATE_FAILED'
            }
            Write-Host "G2C_WINDOWS_PLAN_ONLY_PASS $film"
          }
      - name: Reject downloading into Git worktree
        shell: pwsh
        run: |
          $script = ".\shared\experiments\yu-video-understanding-poc-v0\g2c-windows-official-media.ps1"
          $blocked = $false
          try {
            & $script -Mode Plan -Film Sintel -OutputDirectory $env:GITHUB_WORKSPACE | Out-Null
          }
          catch {
            if ($_.Exception.Message -match 'media destination must be outside Git repository') {
              $blocked = $true
            }
            else { throw }
          }
          if (-not $blocked) { throw 'G2C_REPOSITORY_MEDIA_WRITE_NOT_BLOCKED' }
          $folder = Join-Path $env:LOCALAPPDATA 'YOUTOPIA\G2C-AuthorizedPublisherMedia'
          if (Test-Path -LiteralPath $folder) { throw 'G2C_PLAN_CREATED_MEDIA_DIRECTORY' }
          Write-Host 'G2C_WINDOWS_NO_DOWNLOAD_NO_REPO_WRITE_PASS'

      - name: Parse G2-D manual review PowerShell without local media or network
        shell: pwsh
        run: |
          $script = (Resolve-Path '.\shared\experiments\yu-video-understanding-poc-v0\g2d-windows-manual-review.ps1').Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
          if ($null -ne $errors -and $errors.Count -gt 0) {
            throw ("G2D_POWERSHELL_PARSE_FAILED: " + ($errors | Out-String))
          }
          node --check .\shared\experiments\yu-video-understanding-poc-v0\g2d-human-review.cjs
          $workspace = (Resolve-Path '.\shared\experiments\yu-video-understanding-poc-v0\g2d-open-workspace.ps1').Path
          $wt = $null
          $we = $null
          [System.Management.Automation.Language.Parser]::ParseFile($workspace, [ref]$wt, [ref]$we) | Out-Null
          if ($null -ne $we -and $we.Count -gt 0) { throw ("G2D_WORKSPACE_POWERSHELL_PARSE_FAILED: " + ($we | Out-String)) }
          node --check .\shared\experiments\yu-video-understanding-poc-v0\g2d-workspace-server.cjs
          node --check .\shared\experiments\yu-video-understanding-poc-v0\g2d-workspace-media.cjs
          node --check .\shared\experiments\yu-video-understanding-poc-v0\g2d-workspace-client.js
          $g2e = (Resolve-Path '.\shared\experiments\yu-video-understanding-poc-v0\g2e-windows-gold-pilot.ps1').Path
          $g2eTokens = $null
          $g2eErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($g2e, [ref]$g2eTokens, [ref]$g2eErrors) | Out-Null
          if ($null -ne $g2eErrors -and $g2eErrors.Count -gt 0) {
            throw ("G2E_WINDOWS_GOLD_PILOT_PARSE_FAILED: " + ($g2eErrors | Out-String))
          }
          node --check .\shared\experiments\yu-video-understanding-poc-v0\g2e-gold-pilot.cjs
          Write-Host 'G2E_WINDOWS_GOLD_PILOT_PARSE_PASS_NO_REAL_LABELS_NO_API'
          $g2f = (Resolve-Path '.\shared\experiments\yu-video-understanding-poc-v0\g2f-windows-independent-review.ps1').Path
          $g2fTokens = $null
          $g2fErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($g2f, [ref]$g2fTokens, [ref]$g2fErrors) | Out-Null
          if ($null -ne $g2fErrors -and $g2fErrors.Count -gt 0) {
            throw ("G2F_WINDOWS_BLIND_REVIEW_PARSE_FAILED: " + ($g2fErrors | Out-String))
          }
          node --check .\shared\experiments\yu-video-understanding-poc-v0\g2f-blind-review.cjs
          $g2fweb = (Resolve-Path '.\shared\experiments\yu-video-understanding-poc-v0\g2f-open-reviewer-workspace.ps1').Path
          $reviewerTokens = $null
          $reviewerErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($g2fweb, [ref]$reviewerTokens, [ref]$reviewerErrors) | Out-Null
          if ($null -ne $reviewerErrors -and $reviewerErrors.Count -gt 0) {
            throw ("G2F_WEB_REVIEWER_LAUNCHER_PARSE_FAILED: " + ($reviewerErrors | Out-String))
          }
          node --check .\shared\experiments\yu-video-understanding-poc-v0\g2f-reviewer-workspace-server.cjs
          node --check .\shared\experiments\yu-video-understanding-poc-v0\g2f-reviewer-workspace-client.js
          Write-Host 'G2F_REVIEWER_WEB_WINDOWS_PARSE_PASS_NO_EXTERNAL_MEDIA'
          Write-Host 'G2F_WINDOWS_BLIND_REVIEW_PARSE_PASS_NO_MEDIA_NO_INDEPENDENCE_CLAIM'
          Write-Host 'G2D_WINDOWS_PARSE_ONLY_PASS_NO_MEDIA_NO_YOUTUBE_NO_LLM'

name: Frontend and extension validation

on:
  pull_request:
    branches:
      - frontend
  push:
    branches:
      - frontend

permissions:
  contents: read

concurrency:
  group: frontend-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension-and-contracts:
    name: Extension and shared contracts (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check extension JavaScript syntax
        run: |
          for file in extension/*.js; do
            node --check "$file"
          done

      - name: Extension regression tests
        run: node --test extension/tests/*.test.cjs

      - name: Analysis contract tests
        run: node --test shared/contracts/analysis-v1/tests/*.test.cjs

      - name: Admin contract tests
        run: node --test shared/contracts/admin-v1/tests/*.test.cjs

      - name: YU-32 operations API candidate tests (offline only)
        run: node --test shared/contracts/yu32-operations-v0/tests/*.test.cjs

      - name: YU-32 G4-3 persistence and recovery design tests (offline only)
        run: node --test shared/contracts/yu32-g4-3-design-v0/tests/*.test.cjs

      - name: G4-5 YouTube source readiness offline contract (NO external API)
        run: |
          node --check shared/contracts/yu32-youtube-readiness-v0/scripts/windows-local-preflight.cjs
          node --check shared/contracts/yu32-youtube-readiness-v0/source-plan.cjs
          node --test shared/contracts/yu32-youtube-readiness-v0/tests/*.test.cjs

      - name: G4-4 disposable lab static guards (NO database or Docker execution)
        run: |
          node --check shared/experiments/yu32-g4-4-lab-v0/scripts/run-lab.mjs
          node --check shared/experiments/yu32-g4-4-lab-v0/scripts/worker-process.mjs
          node --check shared/experiments/yu32-g4-4-lab-v0/scripts/worker-probes.mjs
          node --test shared/experiments/yu32-g4-4-lab-v0/tests/static.test.cjs

      - name: G4-5 synthetic collection and analysis pipeline (NO live API)
        run: |
          node --check shared/experiments/yu32-g45-offline-pipeline-v0/src/ingest.cjs
          node --check shared/experiments/yu32-g45-offline-pipeline-v0/src/synthetic-classifier.cjs
          node --check shared/experiments/yu32-g45-offline-pipeline-v0/src/pipeline.cjs
          node --check shared/experiments/yu32-g45-offline-pipeline-v0/src/local-source-adapter.cjs
          node --check shared/experiments/yu32-g45-offline-pipeline-v0/src/first-page-provider-transport.cjs
          node --check shared/experiments/yu32-g45-offline-pipeline-v0/scripts/run-offline.cjs
          node --check shared/experiments/yu32-g45-offline-pipeline-v0/src/admin-purge.cjs
          node --check shared/experiments/yu32-g45-offline-pipeline-v0/scripts/run-admin-purge-demo.cjs
          node --test shared/experiments/yu32-g45-offline-pipeline-v0/tests/*.test.cjs
          node shared/experiments/yu32-g45-offline-pipeline-v0/scripts/run-offline.cjs --check
          node shared/experiments/yu32-g45-offline-pipeline-v0/scripts/run-offline.cjs --demo partial > /dev/null
          node shared/experiments/yu32-g45-offline-pipeline-v0/scripts/run-admin-purge-demo.cjs --check
          node shared/experiments/yu32-g45-offline-pipeline-v0/scripts/run-admin-purge-demo.cjs --demo-admin-delete > /dev/null
          node shared/experiments/yu32-g45-offline-pipeline-v0/scripts/run-admin-purge-demo.cjs --demo-expiry > /dev/null
          node shared/experiments/yu32-g45-offline-pipeline-v0/scripts/run-admin-purge-demo.cjs --demo-user-erasure > /dev/null

      - name: Synthetic scheduler tests
        run: node --test shared/experiments/coverage-scheduler-v0/tests/*.test.cjs

  frontend:
    name: React frontend tests and build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm from the locked package manager version
        uses: pnpm/action-setup@v4
        with:
          version: "12.9.1"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frozen frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Frontend unit tests
        run: pnpm --dir frontend test

      - name: Frontend type check and build
        run: pnpm --dir frontend build


  r04y-loopback-http-integration:
    name: UI-R04-AA Vite-to-Spring state HTTP (NO real API)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout frontend integration PR
        uses: actions/checkout@v4

      - name: Checkout pinned Spring test-only fixture (no branch merge)
        uses: actions/checkout@v4
        with:
          repository: Choi1999/YOUTOPIA
          ref: 5069a81979fd8ef10123e32d00fa35900b450944
          path: _r04x_backend

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 24 and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '12.9.1'

      - name: Prepare pinned Gradle 8.14.3 CLI from immutable official image (R04-AA)
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/ci/prepare-r04-pinned-gradle.sh
          bash tools/ci/prepare-r04-pinned-gradle.sh _r04x_backend

      - name: Start local-only Spring TEST fixture, no secrets or provider API
        shell: bash
        run: |
          set -euo pipefail
          chmod +x _r04x_backend/gradlew
          (
            cd _r04x_backend
            setsid "$R04_PINNED_GRADLE" --no-daemon runR04XSyntheticMetadataLoopback \
              > /tmp/r04x-spring.log 2>&1 &
            echo $! > /tmp/r04x-spring.pid
          )
          for i in $(seq 1 120); do
            if curl -fsS --max-time 2 \
              'http://127.0.0.1:8765/api/v1/youtube/metadata/synthetic/videos/Ab0_-123xyz' \
              > /tmp/r04x-ready.json 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          tail -n 90 /tmp/r04x-spring.log
          echo 'R04X Spring test-only loopback did not start.'
          exit 1

      - name: Install frontend dependencies and start flagged Vite dev proxy
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir frontend install --frozen-lockfile
          setsid env VITE_R04Y_SYNTHETIC_HTTP=enabled VITE_R04AA_METADATA_STATES=enabled VITE_R04AC_DIAGNOSTICS=enabled \
            pnpm --dir frontend dev --host 127.0.0.1 \
            > /tmp/r04y-vite.log 2>&1 &
          echo $! > /tmp/r04y-vite.pid
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 'http://127.0.0.1:5173/analysis/youtube/workspace' \
              > /dev/null 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          tail -n 90 /tmp/r04y-vite.log
          echo 'R04Y Vite dev proxy did not start.'
          exit 1

      - name: Verify three same-origin GETs actually traverse Vite to Spring
        run: node frontend/scripts/checkR04YSyntheticHttp.mjs

      - name: Verify versioned READY/NOT_FOUND/FAILED/STALE state contract through Vite
        run: node frontend/scripts/checkR04AAMetadataStates.mjs

      - name: Stop only the two owned localhost fixture processes
        if: always()
        shell: bash
        run: |
          for service in r04y-vite r04x-spring; do
            if test -f "/tmp/$service.pid"; then
              pid=$(cat "/tmp/$service.pid")
              kill -- "-$pid" 2>/dev/null || kill "$pid" 2>/dev/null || true
            fi
          done


  r04ag-pinned-denied-consumer-integration:
    name: UI-R04-AG pinned AF MockMvc + Vite/Spring deny HTTP (NO real API)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout AG frontend branch
        uses: actions/checkout@v4

      - name: Checkout exact PR96 AF backend test-only fixture (no merge)
        uses: actions/checkout@v4
        with:
          repository: Choi1999/YOUTOPIA
          ref: 2a7836472efe154e78e5ac597f8c7a9dd67aaf9e
          path: _r04ag_backend

      - name: Confirm frozen Spring SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _r04ag_backend rev-parse HEAD)" = \
            "2a7836472efe154e78e5ac597f8c7a9dd67aaf9e"
          test -f _r04ag_backend/src/test/java/com/youtopia/youtube/metadata/MetadataConsumerOfflineSecurityTest.java

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup locked pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '12.9.1'

      - name: Prepare pinned Gradle 8.14.3 CLI from immutable official image (R04-AG)
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/ci/prepare-r04-pinned-gradle.sh
          bash tools/ci/prepare-r04-pinned-gradle.sh _r04ag_backend

      - name: Verify actual AF Spring 401/403/503 through pinned MockMvc and request contracts
        shell: bash
        run: |
          set -euo pipefail
          cd _r04ag_backend
          test -f ./gradlew
          "$R04_PINNED_GRADLE" --no-daemon test \
            --tests 'com.youtopia.youtube.metadata.MetadataConsumerContractTest' \
            --tests 'com.youtopia.youtube.metadata.MetadataConsumerOfflineSecurityTest'

      - name: Start isolated pinned Spring synthetic test server
        shell: bash
        run: |
          set -euo pipefail
          (
            cd _r04ag_backend
            setsid "$R04_PINNED_GRADLE" --no-daemon runR04XSyntheticMetadataLoopback \
              > /tmp/r04ag-spring.log 2>&1 &
            echo $! > /tmp/r04ag-spring.pid
          )
          for i in $(seq 1 120); do
            if curl -fsS --max-time 2 \
              'http://127.0.0.1:8765/api/v1/youtube/metadata/synthetic/videos/Ab0_-123xyz' \
              > /dev/null 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          tail -n 80 /tmp/r04ag-spring.log
          exit 1

      - name: Start Vite DEV with AF denial probe flags
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir frontend install --frozen-lockfile
          setsid env VITE_R04Y_SYNTHETIC_HTTP=enabled \
            VITE_R04AA_METADATA_STATES=enabled \
            VITE_R04AC_DIAGNOSTICS=enabled \
            VITE_R04AG_CONSUMER_DENIAL=enabled \
            pnpm --dir frontend dev --host 127.0.0.1 \
            > /tmp/r04ag-vite.log 2>&1 &
          echo $! > /tmp/r04ag-vite.pid
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 \
              'http://127.0.0.1:5173/analysis/youtube/workspace' \
              > /dev/null 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          tail -n 80 /tmp/r04ag-vite.log
          exit 1

      - name: Verify deny-by-default Vite proxy and separate synthetic 503
        run: node frontend/scripts/checkR04AGOfflineCrossProcess.mjs

      - name: Stop owned loopback processes
        if: always()
        shell: bash
        run: |
          for service in r04ag-vite r04ag-spring; do
            if test -f "/tmp/$service.pid"; then
              pid=$(cat "/tmp/$service.pid")
              kill -- "-$pid" 2>/dev/null || kill "$pid" 2>/dev/null || true
            fi
          done

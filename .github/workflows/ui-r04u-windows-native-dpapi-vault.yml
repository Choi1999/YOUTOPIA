name: UI-R04-U native Windows DPAPI synthetic vault QA

on:
  pull_request:
    branches:
      - feat/backend-bootstrap
  push:
    branches:
      - feat/backend-bootstrap

permissions:
  contents: read

jobs:
  native-current-user-dpapi:
    runs-on: windows-latest
    name: Java 21 native Windows DPAPI synthetic lifecycle
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Static: no secret ingress or runtime auto-registration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = './src/main/java/com/youtopia/youtube/metadata/WindowsDpapiSyntheticVault.java'
          if (-not (Test-Path -LiteralPath $source)) { throw 'Missing native DPAPI source.' }
          $forbidden = '@(Component|Service|RestController|Controller|Bean|Scheduled)|ProcessBuilder|System\.out|System\.err|System\.getenv|HttpClient|WebClient|RestClient'
          if (Select-String -Path $source -Pattern $forbidden) {
            throw 'Native synthetic DPAPI class contains an unintended execution surface.'
          }
          if (-not (Select-String -Path $source -SimpleMatch 'CRYPTPROTECT_UI_FORBIDDEN') -or
              (Select-String -Path $source -SimpleMatch 'CRYPTPROTECT_LOCAL_MACHINE')) {
            throw 'DPAPI must bind to CurrentUser and forbid prompting.'
          }

      - name: Native JNA DPAPI + ACL + synthetic write/read/rotate/delete QA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\gradlew.bat --no-daemon test --tests 'com.youtopia.youtube.metadata.WindowsDpapiSyntheticVaultTest' --tests 'com.youtopia.youtube.metadata.WindowsDpapiVaultReadinessTest'
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows DPAPI synthetic QA failed.' }
          Write-Output 'Native Windows synthetic CurrentUser DPAPI QA PASS (no real keys).'

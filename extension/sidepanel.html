<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YUTOPIA 분석 패널 · DEMO</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <main class="panel">
      <header class="panel__header">
        <strong>YOUTOPIA</strong>
        <span class="panel__pill">DEMO</span>
      </header>
      <h1>선택한 영상·채널</h1>
      <p class="panel__explain">YU-28 G28-2 · 「더보기」를 클릭한 대상을 이 탭의 Side Panel에 고정합니다.</p>
      <section class="selection" aria-labelledby="selection-title">
        <h2 id="selection-title">선택 대상</h2>
        <p id="selection-status" role="status" aria-live="polite">현재 탭 확인 중…</p>
        <div id="selection-details" hidden>
          <span class="panel__pill">SYNTHETIC · 선택만 확인</span>
          <p class="selection__kind" id="selection-kind"></p>
          <p class="selection__id" id="selection-id"></p>
            <a
              id="web-analysis-link"
              class="web-analysis-link"
              target="_blank"
              rel="noopener noreferrer"
              hidden
            >
              웹 상세 분석 보기 · 로컬 DEMO
            </a>
          <p class="panel__notice">다른 썸네일에 마우스를 올려도 선택은 바뀌지 않습니다. 다른 영상을 고르려면 그 영상의 「더보기」를 직접 클릭하세요.</p>
        </div>
      </section>
      <p class="panel__notice">이 화면은 대상 선택 계약을 검증하는 DEMO입니다. 요약·주제·추이 탭, 실시간 댓글 분석, 로그인, 저장, 결제 기능은 아직 연결되지 않았습니다.</p>
    </main>
    <script src="shared.js"></script>
    <script src="panel-selection-contract.js"></script>
    <script src="web-analysis-link.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>

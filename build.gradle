plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.9'
}

group = 'com.youtopia'
version = '0.1.0-SNAPSHOT'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencyLocking { lockAllConfigurations() }

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.9')
    implementation('org.springframework.boot:spring-boot-starter-webmvc') { exclude group: 'org.springframework.boot', module: 'spring-boot-starter-jackson' }
    implementation 'org.springframework.boot:spring-boot-jackson2'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    testImplementation 'org.springframework.boot:spring-boot-restclient'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxParallelForks = 1
    testLogging { events 'failed', 'skipped'; exceptionFormat = 'full' }
}
tasks.named('test') { exclude '**/*IntegrationTest.class' }
tasks.register('integrationTest', Test) {
    description = 'Requires isolated PostgreSQL 16 and Redis; never point at production.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/*IntegrationTest.class'
    shouldRunAfter test
}
tasks.register('prepareBrowserFixtures', JavaExec) {
    description = 'Explicit disposable loopback fixtures for browser E2E; never uses production variables.'
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.youtopia.integration.BrowserFixtureCommand'
}

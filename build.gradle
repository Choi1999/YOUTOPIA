plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.9'
}

group = 'com.youtopia'
version = '0.1.0-SNAPSHOT'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencyLocking { lockAllConfigurations() }

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.9')
    implementation('org.springframework.boot:spring-boot-starter-webmvc') { exclude group: 'org.springframework.boot', module: 'spring-boot-starter-jackson' }
    implementation 'org.springframework.boot:spring-boot-jackson2'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    testImplementation 'org.springframework.boot:spring-boot-restclient'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def syntheticProcessEnvironment = {
    System.getenv().findAll { name, value ->
        !['DB_', 'PG', 'YOUTOPIA_', 'DOCKER_HOST', 'DOCKER_CONTEXT', 'DOCKER_TLS', 'DOCKER_CERT_PATH'].any { name.startsWith(it) }
    }
}
tasks.withType(Test).configureEach {
    setEnvironment(syntheticProcessEnvironment())
    useJUnitPlatform()
    maxParallelForks = 1
    testLogging { events 'failed', 'skipped'; exceptionFormat = 'full' }
}
tasks.named('test') { exclude '**/*IntegrationTest.class' }
tasks.register('integrationTest', Test) {
    description = 'Uses owned disposable PostgreSQL 16 and Redis prepared by tools/test_services.py.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/*IntegrationTest.class'
    shouldRunAfter test
    // Database/Redis state is external to Gradle's file inputs: never reuse a cached test result.
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    doFirst { configureSyntheticServices(delegate) }
}
// check is the complete backend gate; missing fixtures fail instead of skipping integration.
tasks.named('check') { dependsOn 'integrationTest', 'testFixtureTools' }
tasks.register('testFixtureTools', Exec) {
    setEnvironment(syntheticProcessEnvironment())
    commandLine 'python3', '-m', 'unittest', 'discover', '-s', 'tools', '-p', 'test_test_services.py'
}
def configureSyntheticServices(task) {
    exec { commandLine 'python3', 'tools/test_services.py', 'status', '--quiet' }
    def state = new groovy.json.JsonSlurper().parse(file('build/test-services.json'))
    task.systemProperty 'youtopia.test.postgresPort', state.postgres_port
    task.systemProperty 'youtopia.test.redisPort', state.redis_port
    task.systemProperty 'youtopia.test.postgresContainer', state.postgres
}
tasks.register('prepareBrowserFixtures', JavaExec) {
    setEnvironment(syntheticProcessEnvironment())
    description = 'Explicit disposable loopback fixtures for browser E2E; never uses production variables.'
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.youtopia.integration.BrowserFixtureCommand'
    doFirst { configureSyntheticServices(delegate) }
}
